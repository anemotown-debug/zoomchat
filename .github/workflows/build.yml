name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zoomchat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Look up Fabric versions
        run: python3 scripts/fill_versions.py
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: zoomchat-jar
          path: zoomchat/build/libs/*.jar
      - name: Inspect ChatComponent
        if: always()
        run: |
          for j in $(find "$HOME/.gradle" -name '*.jar' -size +5M 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/gui/components/ChatComponent.class'; then
              echo "== $j"
              javap -p -cp "$j" net.minecraft.client.gui.components.ChatComponent
              break
            fi
          done

name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zoomchat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Look up Fabric versions
        run: python3 scripts/fill_versions.py
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: zoomchat-jar
          path: zoomchat/build/libs/*.jar
      - name: Inspect display mode
        if: always()
        run: |
          javap -p -constants -cp "$HOME/.gradle/caches/fabric-loom/26.3/minecraft-merged.jar" 'net.minecraft.client.gui.components.ChatComponent$DisplayMode'
          javap -p -cp "$HOME/.gradle/caches/fabric-loom/26.3/minecraft-merged.jar" net.minecraft.client.renderer.GameRenderer | grep -i fov

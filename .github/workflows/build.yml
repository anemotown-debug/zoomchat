name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zoomchat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Look up Fabric versions
        run: python3 scripts/fill_versions.py
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: zoomchat-jar
          path: zoomchat/build/libs/*.jar
      - name: Inspect chat fading
        if: always()
        run: |
          J="$HOME/.gradle/caches/fabric-loom/26.3/minecraft-merged.jar"
          echo "== AlphaCalculator"
          javap -p -constants -cp "$J" 'net.minecraft.client.gui.components.ChatComponent$AlphaCalculator' || true
          echo "== ChatComponent uses"
          javap -p -c -cp "$J" net.minecraft.client.gui.components.ChatComponent | grep -E "isChatFocused|AlphaCalculator|DisplayMode|^  (public|private)" || true
          echo "== Callers"
          for c in net.minecraft.client.gui.Gui net.minecraft.client.gui.Hud; do
            echo "-- $c"
            javap -p -c -cp "$J" "$c" 2>/dev/null | grep -B10 -A2 "ChatComponent.extractRenderState" || true
          done

      - name: Inspect classes
        if: always()
        run: |
          for j in $(find "$HOME/.gradle" -name '*.jar' -size +5M 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/gui/components/ChatComponent.class'; then
              echo "== $j"
              javap -p -cp "$j" net.minecraft.client.gui.components.ChatComponent
              echo "== GameRenderer fov"
              javap -p -cp "$j" net.minecraft.client.renderer.GameRenderer | grep -i fov || true
              echo "== Gui chat"
              javap -p -cp "$j" net.minecraft.client.gui.Gui | grep -i chat || true
              echo "== Hud chat"
              javap -p -cp "$j" net.minecraft.client.gui.Hud | grep -i chat || true
              break
            fi
          done
